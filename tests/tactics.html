<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>角色升级 · 反馈预览</title>
<style>body{background:#0c1016;color:#e3e9f3;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;max-width:1440px;margin:24px auto;padding:20px}h1{margin:0}p{color:#aab8c9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#131b26;padding:14px;border:1px solid #293548;border-radius:12px}canvas{width:100%;aspect-ratio:360/340}output{display:block;color:#fff0c9}h2{font-size:17px;margin:0}button{background:#263448;color:#e8effa;border:1px solid #50657f;border-radius:6px;padding:7px 12px;cursor:pointer}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style>
<h1>角色机制升级 · 实际反馈帧</h1><p>正式模拟与渲染模块生成。每张卡可试听该次动作的合成音；捕获牵引、爆炸强命中与破片分别反馈。</p><div class="grid" id="grid"></div>
<script src="../js/config.js"></script><script src="../js/physics.js"></script><script src="../js/skills.js"></script><script src="../js/world.js"></script><script src="../js/aim.js"></script><script src="../js/flyers.js"></script><script src="../js/mines.js"></script><script src="../js/pursuit.js"></script><script src="../js/characters.js"></script><script src="../js/roles.js"></script><script src="../js/ranger.js?v=20261014-salvo1"></script><script src="../js/awakening.js"></script><script src="../js/temporal.js"></script><script src="../js/magnet.js"></script><script src="../js/ghost.js"></script><script src="../js/holy.js"></script><script src="../js/cosmic.js?v=20261014-cosmic1"></script><script src="../js/charge.js"></script><script src="../js/stellar.js"></script><script src="../js/arcana.js"></script><script src="../js/engine.js"></script><script src="../js/audio.js"></script><script src="../js/spectacle.js"></script><script src="../js/renderer.js"></script><script src="../js/cosmic-render.js?v=20261014-cosmic1"></script><script src="../js/holy-render.js"></script><script src="../js/tactics-render.js"></script><script src="../js/ranger-render.js?v=20261014-salvo1"></script>
<script>
const G=OrbDuel,scenes=[],audio=new G.Audio();function position(b,x,y){b.x=b.previousX=x;b.y=b.previousY=y;}
function node(e,x,y){return {id:e.nextWorldId++,owner:0,x,y,radius:12,blastRadius:45,armedAt:0,expires:10,color:e.balls[0].def.color,raw:9};}
for(const [phase,title,types] of [['pursuit','擦肩 · 回身追击',['normal','ranger']],['spit','毒液 · 脱手液滴',['venom','normal']],['spill','落空 · 溅液成池',['venom','normal']],['clock','镜片 · 折返飞行时钟',['time','reflector']],['blade','镜片 · 折返弧线飞刃',['boomerang','reflector']],['catch','感应线 · 拉索捕获',['trapper','normal']],['blast','爆破 · 地面冲击与破片',['trapper','normal']],['dynamic','觉醒 · 动态扫线',['trapper','normal']],['holy','圣光 · 厚实压落 / 庄重钟鸣',['holy','normal']]]){
 const e=new G.Engine(types,'tactic-scene-'+phase);e.start();e.balls.forEach((b,i)=>{position(b,70+i*200,190);b.vx=b.vy=0;});const [a,b]=e.balls;let found=false;
 if(phase==='pursuit'){position(a,140,170);position(b,191,170);a.vx=235;G.Pursuit.update(e);b.x=190;G.Pursuit.update(e);b.x=191;G.Pursuit.update(e);found=a.role.pursuits===1;}
 if(phase==='spit'||phase==='spill'){a.role.nextSpit=0;G.Flyers.poisonUpdate(a,e);if(phase==='spit'){G.World.update(e,.15);found=e.projectiles.length===1;}else{const p=e.projectiles[0];p.x=350;p.y=110;p.vx=300;p.vy=0;G.World.update(e,.1);found=e.pools.length===1;e.effects.forEach(f=>f.age=.08);}}
 if(phase==='clock'||phase==='blade'){b.stance.phase='active';b.role.mirrors=1;let p;if(phase==='clock'){p={id:e.nextWorldId++,owner:0,x:242,y:190,angle:0,speed:300,radius:9,range:250,travel:0,raw:14,started:0,color:a.def.color};e.timeClocks=[p];G.Temporal.moveClocks(e,.1);e.timeClocks.forEach(v=>v.x-=30);found=e.timeClocks[0]?.owner===1;}else{p=G.World.fire(a,e,{mode:'boomerang',castId:1});const reflected=G.Roles.intercept(p,b,e);e.projectiles=[reflected];reflected.x-=28;found=reflected.mode==='blade'&&a.character.bladeRemaining===0;}e.effects.forEach(f=>f.age=.08);}
 if(phase==='catch'){e.traps=[node(e,130,170),node(e,230,170)];position(b,180,162);b.previousY=130;G.Mines.update(e);e.time=.12;G.Mines.update(e);e.effects.forEach(f=>f.age=.06);found=e.traps.some(m=>m.captureUntil);}
 if(phase==='blast'){e.traps=[node(e,160,170)];position(b,181,170);G.Mines.update(e);G.Combat.resolveBatch(e.pendingAttacks,e);e.effects.forEach(f=>f.age=.07);e.projectiles.forEach(p=>{p.x+=p.vx*.08;p.y+=p.vy*.08;});found=e.hitStopSerial===1&&e.projectiles.length===4;}
 if(phase==='dynamic'){G.Awakening.activate(a,e);position(a,270,260);e.traps=[node(e,100,100),node(e,290,70)];position(b,210,120);found=G.Mines.links(e).some(l=>l.dynamic);}
 if(phase==='holy'){position(a,90,200);position(b,235,200);G.Holy.light(a,e,b,'zone',9,0,6);G.Holy.updateWorld(e,G.Constants.dt);G.Combat.resolveBatch(e.pendingAttacks,e);e.time=.035;e.effects.forEach(f=>f.age=.035);e.sound('holyCharge',a.x);found=e.hitStopSerial===1;}
 e.pause();const card=document.createElement('article');card.className='card';card.innerHTML='<h2>'+title+'</h2><canvas></canvas><output></output><button>试听动作</button>';document.querySelector('#grid').append(card);const renderer=new G.Renderer(card.querySelector('canvas'));renderer.draw(e);card.querySelector('output').textContent='有效顿帧 '+(e.hitStopDuration*1000).toFixed(0)+'ms · 实体 '+(e.projectiles.length+e.timeClocks.length)+' · 节点 '+e.traps.length;card.querySelector('button').onclick=async()=>{await audio.unlock();audio.stop();audio.consume(e.soundEvents);};scenes.push({phase,found,e,renderer});
}window.tacticsDemo={scenes,reports:scenes.map(({phase,found,e})=>({phase,found,stop:e.hitStopDuration,cues:e.soundEvents.map(s=>s.kind)}))};
</script></html>
