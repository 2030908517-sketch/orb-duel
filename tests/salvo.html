<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>射手战术 · 反馈预览</title>
<style>body{background:#0c1016;color:#e3e9f3;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;max-width:1440px;margin:24px auto;padding:20px}h1{margin:0}p{color:#aab8c9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#131b26;padding:14px;border:1px solid #293548;border-radius:12px}canvas{width:100%;aspect-ratio:360/340}output{display:block;color:#fff0c9}h2{font-size:17px;margin:0}button{background:#263448;color:#e8effa;border:1px solid #50657f;border-radius:6px;padding:7px 12px;cursor:pointer}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style>
<h1>射手三种模式 · 实际反馈帧</h1><p>正式模拟与渲染模块生成。每张卡可试听该次动作的合成音。狙击线细而清晰，受伤变红，出膛为实体弹。</p><div class="grid" id="grid"></div>
<script src="../js/config.js"></script><script src="../js/physics.js"></script><script src="../js/skills.js"></script><script src="../js/world.js"></script><script src="../js/aim.js"></script><script src="../js/flyers.js"></script><script src="../js/mines.js"></script><script src="../js/pursuit.js"></script><script src="../js/characters.js"></script><script src="../js/roles.js"></script><script src="../js/ranger.js?v=20261014-salvo1"></script><script src="../js/awakening.js"></script><script src="../js/temporal.js"></script><script src="../js/magnet.js"></script><script src="../js/ghost.js"></script><script src="../js/holy.js"></script><script src="../js/cosmic.js?v=20261014-cosmic1"></script><script src="../js/charge.js"></script><script src="../js/stellar.js"></script><script src="../js/arcana.js"></script><script src="../js/engine.js"></script><script src="../js/audio.js"></script><script src="../js/spectacle.js"></script><script src="../js/renderer.js"></script><script src="../js/cosmic-render.js?v=20261014-cosmic1"></script><script src="../js/holy-render.js"></script><script src="../js/tactics-render.js"></script><script src="../js/ranger-render.js?v=20261014-salvo1"></script>
<script>
const G=OrbDuel,scenes=[],audio=new G.Audio();function pos(b,x,y=170){b.x=b.previousX=x;b.y=b.previousY=y;b.vx=b.vy=0;}
for(const [phase,title] of [['burst','未满校准 · 三连发'],['aim','远距 · 细线预瞄'],['lock','锁线 · 单发蓄势'],['hurt','受创 · 本发零层偏移'],['shot','高速实体 · 出膛不追踪'],['hit','狙击命中 · 强击退与顿帧'],['scatter','近距 · 枪阵与重弹'],['save','未拉进范围 · 保留节点'],['counter','基础反伤 · 蓄能反击弹']]){
 const type=phase==='save'?'trapper':phase==='counter'?'reflector':'ranger',e=new G.Engine([type,'normal'],'salvo-scene-'+phase);e.start();e.balls.forEach((b,i)=>pos(b,65+i*215));const [a,b]=e.balls;let found=false;
 if(type==='ranger'){
  G.Awakening.activate(a,e);a.role.calibration=phase==='burst'?0:3;a.role.calibrationUntil=100;if(phase==='scatter')pos(b,160);a.role.reloadUntil=.01;e.time=.01;G.Ranger.update(a,0,e);
  if(phase==='burst'){found=a.role.fireMode==='burst'&&e.projectiles.length===1;e.projectiles[0].x+=50;}
  if(phase==='aim'){e.time=.3;G.Ranger.update(a,0,e);found=a.role.sniperPhase==='aim';}
  if(phase==='lock'||phase==='hurt'){e.time=a.role.sniperLockAt;G.Ranger.update(a,0,e);if(phase==='hurt')G.Combat.applyDamage(a,2,e);found=a.role.sniperPhase==='locked'&&(phase!=='hurt'||a.role.sniperHurt);}
  if(phase==='shot'||phase==='hit'){e.time=a.role.sniperFireAt;G.Ranger.update(a,0,e);const p=e.projectiles[0];if(phase==='shot'){p.x=170;p.y=170;found=p.sniper&&a.role.sniperPending===p.id;}else{p.x=b.x;p.y=b.y;G.World.update(e,0);G.Combat.resolveBatch(e.pendingAttacks,e);found=a.role.calibration===3&&e.hitStopSerial>0;}}
  if(phase==='scatter'){for(const t of [.31,.53,.75]){e.time=t;G.Ranger.update(a,0,e);}e.projectiles.forEach((p,i)=>{p.x+=45+(i<3?75:0);p.y+=Math.sin(Math.atan2(p.vy,p.vx))*75;});found=e.projectiles.length===7&&e.projectiles.at(-1).heavy&&a.role.calibration===0;}
 }
 if(phase==='save'){pos(a,80,270);pos(b,290,100);e.traps=[{id:0,owner:0,x:120,y:130,radius:12,blastRadius:45,raw:9,armedAt:0,expires:10,color:a.def.color}];G.Mines.capture(e.traps[0],b,a,e);e.time=.3;G.Mines.update(e);found=e.traps.length===1&&!e.pendingAttacks.length&&!e.projectiles.length;}
 if(phase==='counter'){G.Roles.reflectorOpen(a,e);G.Combat.resolveBatch([{source:b,target:a,raw:10,kind:'shot'}],e);e.time=a.stance.until;G.Roles.reflectorUpdate(a,0,e);e.time=a.role.counterFireAt;G.Roles.reflectorUpdate(a,0,e);e.projectiles.forEach(p=>p.x+=50);found=e.projectiles.length===1&&!G.Awakening.active(a);}
 e.effects.forEach(f=>f.age=.06);e.pause();const card=document.createElement('article');card.className='card';card.innerHTML='<h2>'+title+'</h2><canvas></canvas><output></output><button>试听动作</button>';document.querySelector('#grid').append(card);const renderer=new G.Renderer(card.querySelector('canvas'));renderer.draw(e);card.querySelector('output').textContent='顿帧 '+(e.hitStopDuration*1000).toFixed(0)+'ms · '+(type==='ranger'?'校准 '+a.role.calibration+'/3 · 散布 '+G.Ranger.status(a,e)[4].value:'节点 '+e.traps.length);card.querySelector('button').onclick=async()=>{await audio.unlock();audio.stop();audio.consume(e.soundEvents);};scenes.push({phase,found,e,renderer});
}window.salvoDemo={scenes,reports:scenes.map(({phase,found,e})=>({phase,found,stop:e.hitStopDuration,cues:e.soundEvents.map(s=>s.kind)}))};
</script></html>
