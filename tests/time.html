<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>时间球实际机制验证</title>
<style>body{background:#0c1016;color:#e3e9f3;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;max-width:1160px;margin:24px auto;padding:20px}h1{margin:0 0 5px}p{color:#9aa9bb}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.card{background:#131b26;padding:16px;border:1px solid #293548;border-radius:12px}canvas{width:100%;aspect-ratio:360/340}output{display:block;min-height:28px;color:#c2b6ff}h2{font-size:18px;margin:0 0 8px}pre{white-space:pre-wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>
<h1>时间球 · 实际模拟画面</h1><p>钟面领域 / 时钟投掷 / 爆炸沉默与强制打断 / 盾量驱动的压力波。使用正式引擎步进到对应阶段。</p><div class="grid" id="grid"></div><details><summary>查看验证数据</summary><pre id="results"></pre></details>
<script src="../js/config.js"></script><script src="../js/physics.js"></script><script src="../js/skills.js"></script><script src="../js/world.js"></script><script src="../js/aim.js?v=20261014-tactics1"></script><script src="../js/flyers.js?v=20261014-tactics1"></script><script src="../js/mines.js?v=20261014-tactics1"></script><script src="../js/pursuit.js?v=20261014-tactics1"></script><script src="../js/characters.js"></script><script src="../js/roles.js"></script><script src="../js/ranger.js?v=20261014-salvo1"></script><script src="../js/awakening.js"></script><script src="../js/temporal.js"></script><script src="../js/magnet.js"></script><script src="../js/ghost.js"></script><script src="../js/holy.js?v=20261014-holy4"></script><script src="../js/cosmic.js?v=20261014-cosmic1"></script><script src="../js/charge.js"></script><script src="../js/stellar.js"></script><script src="../js/arcana.js"></script><script src="../js/engine.js"></script><script src="../js/audio.js"></script><script src="../js/spectacle.js"></script><script src="../js/renderer.js"></script><script src="../js/cosmic-render.js?v=20261014-cosmic1"></script><script src="../js/holy-render.js?v=20261014-holy4"></script><script src="../js/tactics-render.js?v=20261014-tactics1"></script><script src="../js/ranger-render.js?v=20261014-salvo1"></script>
<script>
const G=OrbDuel,scenes=[],reports=[];
for(const [phase,title] of [['domain','时间领域 · 减速 80% / 侵蚀'],['flight','零时禁令 · 时钟飞行'],['silence','时钟碎裂 · 爆炸沉默 / 施法中断'],['shield','堡垒震荡 · 17 余盾驱动的冲击波']]){
 const card=document.createElement('article');card.className='card';card.innerHTML='<h2>'+title+'</h2><canvas></canvas><output></output>';document.querySelector('#grid').append(card);
 const e=new G.Engine(phase==='shield'?['shield','normal']:['time','laser'],'time-visual-'+phase);e.start();const [b,t]=e.balls;b.x=90;b.y=175;b.speed=40;b.vx=0;b.vy=40;t.x=235;t.y=175;t.speed=40;t.vx=0;t.vy=-40;
 if(phase==='domain'){b.temporal.nextDomain=0;t.laser=null;t.role.capacitor=0;}
 else if(phase==='shield'){G.Awakening.activate(b,e);b.shieldUntil=.01;}
 else {G.Awakening.activate(b,e);b.temporal.nextClock=0;b.temporal.nextDomain=Infinity;t.laser={origin:{x:t.x,y:t.y},angle:0,trackUntil:2.7,fireAt:3,locked:false,awake:false};}
 let found=false;for(let i=0;i<2400&&e.state==='running';i++){e.step();found=phase==='domain'?t.temporal.rate<1&&e.time>.35:phase==='flight'?e.timeClocks.some(c=>c.travel>45):phase==='silence'?G.Temporal.silenced(t,e)&&e.effects.some(f=>f.kind==='timeBurst'&&f.age>.07):e.waves.some(w=>w.travel>75);if(found)break;}
 e.pause();const renderer=new G.Renderer(card.querySelector('canvas'));renderer.draw(e);const text=phase==='silence'?'命中 '+b.stats.clocksHit+' · 沉默 '+(t.temporal.silenceUntil-e.time).toFixed(2)+'s · 蓄力已中断':phase==='shield'?'压力 0 · 余盾 17 · 波伤 '+e.waves[0]?.raw.toFixed(1):'敌方时间 '+Math.round(t.temporal.rate*100)+'% · 模拟 '+e.time.toFixed(2)+'s';card.querySelector('output').textContent=text;
 scenes.push({e,renderer});reports.push({phase,found,time:e.time,enemyRate:t.temporal.rate,silenced:G.Temporal.silenced(t,e),clocksHit:b.stats.clocksHit,interrupted:t.stats.interruptions,waveDamage:e.waves[0]?.raw});
}
window.timeDemo={scenes,reports};document.querySelector('#results').textContent=JSON.stringify({passed:reports.every(r=>r.found),reports},null,2);
window.addEventListener('resize',()=>scenes.forEach(s=>s.renderer.draw(s.e)));
</script></html>
