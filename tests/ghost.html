<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>幽灵穿行与磁吸补偿</title>
<style>body{background:#0c1016;color:#e3e9f3;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;max-width:1440px;margin:24px auto;padding:20px}h1{margin:0 0 5px}p{color:#9aa9bb}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#131b26;padding:14px;border:1px solid #293548;border-radius:12px}canvas{width:100%;aspect-ratio:360/340}output{display:block;min-height:28px;color:#cfedf0}h2{font-size:17px;margin:0 0 8px}pre{white-space:pre-wrap}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style>
<h1>幽灵球 · 追魂三连穿 / 磁力球 · 捕获补偿</h1><p>正式模块控制场景：穿体恐吓、弹丸穿透、墙面反弹、三段追魂、退相魂爆、牵引轻墙伤、吸力补偿与反击弹偏转。</p><div class="grid" id="grid"></div><details><summary>查看机制数据</summary><pre id="results"></pre></details>
<script src="../js/config.js"></script><script src="../js/physics.js"></script><script src="../js/skills.js"></script><script src="../js/world.js"></script><script src="../js/aim.js?v=20261014-tactics1"></script><script src="../js/flyers.js?v=20261014-tactics1"></script><script src="../js/mines.js?v=20261014-tactics1"></script><script src="../js/pursuit.js?v=20261014-tactics1"></script><script src="../js/characters.js"></script><script src="../js/roles.js"></script><script src="../js/ranger.js?v=20261014-salvo1"></script><script src="../js/awakening.js"></script><script src="../js/temporal.js"></script><script src="../js/magnet.js"></script><script src="../js/ghost.js"></script><script src="../js/holy.js?v=20261014-holy4"></script><script src="../js/cosmic.js?v=20261014-cosmic1"></script><script src="../js/charge.js"></script><script src="../js/stellar.js"></script><script src="../js/arcana.js"></script><script src="../js/engine.js"></script><script src="../js/audio.js"></script><script src="../js/spectacle.js"></script><script src="../js/renderer.js"></script><script src="../js/cosmic-render.js?v=20261014-cosmic1"></script><script src="../js/holy-render.js?v=20261014-holy4"></script><script src="../js/tactics-render.js?v=20261014-tactics1"></script><script src="../js/ranger-render.js?v=20261014-salvo1"></script>
<script>
const G=OrbDuel,scenes=[],reports=[];
for(const [phase,title] of [['pass','虚化 · 穿体恐吓 / 自身免伤'],['bullet','虚化 · 实体弹丸穿透'],['wall','虚化 · 墙壁仍然反弹'],['lunge','觉醒 · 三段预瞄追魂'],['soul','退相 · 短程魂爆'],['pullWall','磁吸落空 · 动能轻墙伤'],['compensation','没有捕获 · 下次吸力 +12%'],['counter','镜面反击弹 · 实体偏转']]){
 const card=document.createElement('article');card.className='card';card.innerHTML='<h2>'+title+'</h2><canvas></canvas><output></output>';document.querySelector('#grid').append(card);let e,found=false;
 for(let attempt=0;attempt<(phase==='compensation'?24:1)&&!found;attempt++){
  e=new G.Engine(phase==='bullet'?['ranger','ghost']:['pullWall','compensation','counter'].includes(phase)?['magnet',phase==='counter'?'reflector':'normal']:['ghost','normal'],'ghost-frame-'+phase+'-'+attempt);e.start();const [a,b]=e.balls;a.x=90;a.y=170;b.x=210;b.y=170;a.speed=220;a.vx=220;a.vy=0;b.speed=0;b.vx=b.vy=0;a.magnetic.nextPulse=Infinity;
  let flying=null;
  if(phase==='bullet'){a.speed=0;a.vx=0;a.nextShot=99;b.ghost.nextPhase=6.4;G.Ghost.enter(b,e);G.World.fire(a,e,{angle:0});flying=e.projectiles[0];}
  else if(['pullWall','compensation'].includes(phase)){a.x=100;a.y=95;b.x=280;b.y=245;a.speed=210;b.speed=235;const angle=attempt*Math.PI/12;a.vx=Math.cos(angle)*210;a.vy=Math.sin(angle)*210;b.vx=Math.cos(angle+Math.PI*.65)*235;b.vy=Math.sin(angle+Math.PI*.65)*235;G.Magnet.pulse(a,e,'pull',690);}
  else if(phase==='counter'){a.speed=0;a.vx=0;b.x=260;G.World.counter(b,e,8,Math.PI);flying=e.projectiles[0];G.Magnet.pulse(a,e,'push',780);}
  else{if(['lunge','soul'].includes(phase)){b.x=250;b.speed=70;b.vy=70;G.Awakening.activate(a,e);}if(phase==='wall'){a.x=23.01;a.vx=-220;}G.Ghost.enter(a,e);a.ghost.nextPhase=6.4;}
  for(let i=0;i<1100&&e.state==='running';i++){e.step();found=phase==='pass'?a.stats.fearHits>0&&Math.hypot(a.x-b.x,a.y-b.y)<26:phase==='bullet'?e.projectiles.includes(flying)&&flying.x>b.x-4&&flying.x<b.x+12:phase==='wall'?a.vx>0&&e.time>.04:phase==='lunge'?a.ghost.lunges>=2&&a.ghost.lungeSpeed>0&&e.effects.some(f=>f.kind==='ghostCut'&&f.age>.035):phase==='soul'?e.effects.some(f=>f.kind==='soulBurst'&&f.age>.08):phase==='pullWall'?a.stats.magneticPullWallHits>0:phase==='compensation'?a.magnetic.pullBonus>0:e.time>.075;if(found)break;if(phase==='compensation'&&e.time>1.31)break;}
 }
 e.pause();const [a,b]=e.balls,renderer=new G.Renderer(card.querySelector('canvas'));renderer.draw(e);const ghost=e.balls.find(b=>b.type==='ghost');card.querySelector('output').textContent=ghost?'生命 '+ghost.hp.toFixed(1)+'/'+ghost.maxHp+' · 恐吓 '+ghost.stats.fearHits+' · 穿行 '+ghost.ghost.lunges+'/3':'牵引墙撞 '+a.stats.magneticPullWallHits+' · 吸力 +'+Math.round(a.magnetic.pullBonus*100)+'% · 飞行物偏转 '+a.stats.flyersBent;
 scenes.push({e,renderer});reports.push({phase,found,time:e.time,ghostHp:ghost?.hp,phased:ghost?G.Ghost.phased(ghost):false,fearHits:ghost?.stats.fearHits,lunges:ghost?.ghost.lunges,soulBursts:ghost?.stats.soulBursts,pullWalls:a.stats.magneticPullWallHits,pullBonus:a.magnetic.pullBonus,flyers:a.stats.flyersBent});
}
window.ghostDemo={scenes,reports};document.querySelector('#results').textContent=JSON.stringify({passed:reports.every(r=>r.found),reports},null,2);window.addEventListener('resize',()=>scenes.forEach(s=>s.renderer.draw(s.e)));
</script></html>
