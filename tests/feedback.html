<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打击与技能反馈 · 实际画面</title><link rel="icon" href="../favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#0c1016;color:#e9edf5;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}h1{font-size:24px;margin:0 0 8px}header p{color:#8b9bb0;margin:0 0 24px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1240px;margin:auto}article{background:#151d28;border:1px solid #303d51;border-radius:9px;overflow:hidden}h2{font-size:14px;margin:14px 15px 5px}p{font-size:11px;color:#9aabc2;margin:0 15px 12px;line-height:1.6}canvas{display:block;width:100%;aspect-ratio:18/17}.badge{float:right;font-size:10px;color:#d0fa8b}#results{white-space:pre-wrap;max-width:1240px;margin:auto;color:#a2d19c;font:11px Consolas,monospace}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:440px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>命中有重量，技能有回响。</h1><p>真实对局步进至触发瞬间。重击、破盾与爆炸有分级冲击；觉醒文字留在场外。</p></header><div class="grid" id="grid"></div><details><summary>查看验证数据</summary><pre id="results"></pre></details>
<script src="../js/config.js?v=20261013-roster1"></script><script src="../js/physics.js?v=20261013-roster1"></script><script src="../js/skills.js?v=20261013-roster1"></script><script src="../js/world.js?v=20261013-roster1"></script><script src="../js/characters.js?v=20261013-roster1"></script><script src="../js/roles.js?v=20261013-roster1"></script><script src="../js/awakening.js?v=20261013-roster1"></script><script src="../js/engine.js?v=20261013-roster1"></script><script src="../js/spectacle.js?v=20261013-roster1"></script><script src="../js/renderer.js?v=20261013-roster1"></script><script>
'use strict';const G=window.OrbDuel,report=[];
for(const [type,cue,title] of [['normal','awakenHit','破限重击'],['accelerator','thunderHit','雷霆突袭'],['shield','fortressBlast','六角震荡'],['ranger','volley','三连枪焰'],['trapper','magnetBlast','磁暴连锁'],['reflector','revengeHit','蓄能返还'],['vampire','bloodPulse','血月双链'],['boomerang','moonCut','双月旋斩'],['laser','beamAwake','聚焦重炮'],['venom','corrosion','腐蚀涡流']]){
 let engine=null;
 for(let seed=0;seed<40&&!engine;seed++){
  const candidate=new G.Engine([type,'normal'],'feedback-'+seed);candidate.start();
  while(candidate.state==='running'&&candidate.time<100){candidate.step();const cues=candidate.soundEvents.splice(0);if(cues.some(e=>e.kind===cue) && candidate.balls[0].awakening.active){engine=candidate;break;}}
 }
 if(!engine){report.push({type,cue,error:'phase not reached'});continue;}
 for(let i=0;i<18&&engine.state==='running';i++)engine.step();
 engine.pause();const b=engine.balls[0],article=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),canvas=document.createElement('canvas');
 h.textContent=title;h.style.color=b.def.color;const badge=document.createElement('span');badge.className='badge';badge.textContent='✦ 已觉醒';h.append(badge);
 p.textContent=b.def.name+' · '+engine.time.toFixed(2)+'s · '+engine.seed;article.append(h,p,canvas);document.querySelector('#grid').append(article);new G.Renderer(canvas).draw(engine);
 report.push({type,cue,seed:engine.seed,time:engine.time,rendered:true,canvasAnnouncement:engine.effects.some(e=>e.kind==='awakening')});
}
document.querySelector('#results').textContent=JSON.stringify({passed:report.length===10&&report.every(r=>r.rendered&&!r.canvasAnnouncement),report},null,2);
</script></body></html>
