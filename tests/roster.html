<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>七角色真实技能帧</title>
<style>body{background:#0c1016;color:#dfe7f0;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;margin:24px}h1{font-size:22px}p{color:#a6b5c5}.grid{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:16px;max-width:1280px}article{background:#141c26;padding:12px;border:1px solid #334253;border-radius:9px}canvas{width:100%;aspect-ratio:360/340;background:#101721;display:block}h2{font-size:16px;margin:0 0 8px}small{color:#9dafc0}pre{white-space:pre-wrap}a{color:#d0fa8b}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(200px,1fr))}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style>
<h1>七角色升级 · 真实对局捕获</h1><p>从正式规则运行种子对局，观察到指定技能后捕获。没有强制觉醒、修改生命、摆放实体或伪造技能。</p><div id="gallery" class="grid"></div><pre id="report">正在捕获…</pre>
<script src="../js/config.js?v=roster-final"></script><script src="../js/physics.js?v=roster-final"></script><script src="../js/skills.js?v=roster-final"></script><script src="../js/world.js?v=roster-final"></script><script src="../js/characters.js?v=roster-final"></script><script src="../js/roles.js?v=roster-final"></script><script src="../js/awakening.js?v=roster-final"></script><script src="../js/engine.js?v=roster-final"></script><script src="../js/audio.js?v=roster-final"></script><script src="../js/spectacle.js?v=roster-final"></script><script src="../js/renderer.js?v=roster-final"></script>
<script>
(async()=>{
 const G=OrbDuel,report=document.querySelector('#report'),records=[],cues=new Set();
 const cases=[
  ['普通 · 破阵拳劲','normal','shield',e=>e.waves.some(w=>w.kind==='fistWave')],
  ['吸血 · 血契收束','vampire','normal',e=>e.effects.some(f=>f.kind==='roster'&&f.style==='bloodFinish')],
  ['护盾 · 承压释放','shield','normal',e=>e.waves.some(w=>w.kind==='pressureWave')],
  ['射手 · 过载末发','ranger','shield',e=>e.projectiles.some(p=>p.heavy)],
  ['激光 · 贯穿重炮','laser','shield',e=>e.beams.length>0],
  ['反伤 · 镜面折返','reflector','ranger',e=>e.projectiles.some(p=>p.owner===0&&p.noMirror)],
  ['反伤 · 镜裂回敬','reflector','normal',e=>e.projectiles.some(p=>p.owner===0&&p.mode==='counter'&&!p.noMirror)],
  ['陷阱 · 感应雷网','trapper','shield',e=>G.Roles.netLinks(e).length>0],
  ['陷阱 · 延迟连锁','trapper','shield',e=>e.traps.some(m=>Number.isFinite(m.detonateAt)&&m.detonateAt>e.time)]
 ];
 try{
  for(const [title,type,enemy,condition] of cases){let captured=null;
   for(let seed=0;seed<40&&!captured;seed++){const e=new G.Engine([type,enemy],'roster-gallery-'+seed);e.start();while(e.state==='running'&&e.time<170){e.step();for(const sound of e.soundEvents)cues.add(sound.kind);e.soundEvents=[];if(condition(e)){captured=e;break;}}}
   if(!captured)throw Error('没有捕获到 '+title);for(let tick=0;tick<12&&captured.state==='running';tick++)captured.step();const e=captured,article=document.createElement('article'),h=document.createElement('h2'),canvas=document.createElement('canvas'),caption=document.createElement('small');h.textContent=title;caption.textContent=e.seed+' · '+e.time.toFixed(3)+'s';article.append(h,canvas,caption);document.querySelector('#gallery').append(article);const renderer=new G.Renderer(canvas);renderer.resize();renderer.draw(e);records.push({title,type,enemy,seed:e.seed,time:e.time,stats:e.balls[0].stats,role:e.balls[0].role,events:e.events.slice(0,3).map(v=>v.text)});await new Promise(r=>setTimeout(r,0));
  }
  const files=['config','physics','skills','world','characters','roles','awakening','engine'],parts=[];for(const name of files){parts.push(new TextEncoder().encode(name));parts.push(new Uint8Array(await (await fetch('../js/'+name+'.js?v=roster-final')).arrayBuffer()));}const bytes=new Uint8Array(parts.reduce((n,p)=>n+p.length,0));let offset=0;for(const p of parts){bytes.set(p,offset);offset+=p.length;}const digest=await crypto.subtle.digest('SHA-256',bytes),rulesSha256=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');
  report.dataset.result='passed';report.textContent=JSON.stringify({passed:true,frames:records.length,rulesSha256,syntheticAudioProfiles:Object.keys(G.Audio.profiles).length,cues:[...cues].sort(),records},null,2);
 }catch(e){report.dataset.result='failed';report.textContent=JSON.stringify({passed:false,error:e.message,frames:records.length},null,2);}
})();
</script></html>
