<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>觉醒技能 · 画面校验</title><link rel="icon" href="../favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#0c1016;color:#e9edf5;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}h1{font-size:24px;margin:0 0 8px}header p{color:#8b9bb0;margin:0 0 24px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:1240px;margin:auto}article{background:#151d28;border:1px solid #303d51;border-radius:9px;overflow:hidden}h2{font-size:14px;margin:14px 15px 5px}p{font-size:11px;color:#9aabc2;margin:0 15px 12px;line-height:1.6}canvas{display:block;width:100%;aspect-ratio:18/17}#results{max-width:1240px;margin:24px auto;font:11px Consolas,monospace;color:#a2d19c;white-space:pre-wrap}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:440px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>十种觉醒 · 实际技能画面</h1><p>使用固定种子，从开场按真实规则步进到技能触发阶段，冻结画面检查。此页仅用于开发验证。</p></header><div class="grid" id="grid"></div><details><summary>查看验证数据</summary><pre id="results"></pre></details>
<script src="../js/config.js?v=20261013-roster1"></script><script src="../js/physics.js?v=20261013-roster1"></script><script src="../js/skills.js?v=20261013-roster1"></script><script src="../js/world.js?v=20261013-roster1"></script><script src="../js/characters.js?v=20261013-roster1"></script><script src="../js/roles.js?v=20261013-roster1"></script><script src="../js/awakening.js?v=20261013-roster1"></script><script src="../js/engine.js?v=20261013-roster1"></script><script src="../js/spectacle.js?v=20261013-roster1"></script><script src="../js/renderer.js?v=20261013-roster1"></script><script>
'use strict';const G=window.OrbDuel,report=[];
function ready(e,type){const b=e.balls[0],a=b.awakening,t=e.time;if(!a.active || e.state!=='running' || e.effects.some(f=>f.kind==='awakening'))return false;
 if(type==='vampire')return a.chainUntil>t+.2;
 if(type==='accelerator')return G.Awakening.dashing(b,e) && a.dashUntil-t<=.2;
 if(type==='reflector')return b.stance.phase==='active' && b.stance.stored>0;
 if(type==='shield')return b.shield>0;
 if(type==='ranger')return e.projectiles.filter(p=>p.owner===0).length===3;
 if(type==='boomerang')return e.projectiles.some(p=>p.mode==='boomerang' && p.returning);
 if(type==='laser')return e.effects.some(f=>f.kind==='beam');
 if(type==='venom')return e.pools.length>0 && e.balls[1].poison;
 if(type==='trapper')return e.effects.some(effect=>effect.kind==='arc');
 return true;}
for(const type of Object.keys(G.Types)){
 let engine=null;
 for(let seed=0;seed<30 && !engine;seed++){
  const candidate=new G.Engine([type,'normal'],'visual-awakening-'+seed);candidate.start();
  while(candidate.state==='running' && candidate.time<90){candidate.step();if(ready(candidate,type)){engine=candidate;break;}}
 }
 if(!engine){report.push({type,error:'phase not reached'});continue;}
 engine.pause();const b=engine.balls[0],article=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),canvas=document.createElement('canvas');
 h.textContent=b.def.name+' · '+G.Awakening.defs[type].name;h.style.color=b.def.color;
 p.textContent='攻击 '+G.Combat.attackValue(b,engine).toFixed(1)+' · 速度 '+Math.round(b.motionSpeed||b.speed)+' · '+engine.time.toFixed(2)+'s · '+engine.seed;
 article.append(h,p,canvas);document.querySelector('#grid').append(article);new G.Renderer(canvas).draw(engine);
 report.push({type,seed:engine.seed,time:engine.time,phase:G.Awakening.status(b,engine),rendered:true});
}
document.querySelector('#results').textContent=JSON.stringify({passed:report.length===10 && report.every(r=>r.rendered),report},null,2);
</script></body></html>
