<style>body{background:#0c1016;color:#e3e9f3;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;max-width:1440px;margin:24px auto;padding:20px}h1{margin:0}p{color:#aab8c9}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#131b26;padding:14px;border:1px solid #293548;border-radius:12px}canvas{width:100%;aspect-ratio:360/340}output{display:block;color:#fff0c9}h2{font-size:17px;margin:0}button{background:#263448;color:#e8effa;border:1px solid #50657f;border-radius:6px;padding:7px 12px;cursor:pointer}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style>
<h1>魂影回响 · 实际反馈帧</h1><p>正式模拟与渲染模块生成。每张卡可试听该次动作的合成音。本体虚化碰墙正常反弹；魂影同速重放，拖尾保持原样，魂影轨迹使用固定宽雾带并平滑淡出。</p><div class="grid" id="grid"></div>
<script src="../js/config.js"></script><script src="../js/physics.js"></script><script src="../js/skills.js"></script><script src="../js/world.js"></script><script src="../js/aim.js"></script><script src="../js/flyers.js"></script><script src="../js/mines.js"></script><script src="../js/pursuit.js"></script><script src="../js/characters.js"></script><script src="../js/roles.js"></script><script src="../js/ranger.js?v=20261014-salvo1"></script><script src="../js/awakening.js"></script><script src="../js/temporal.js"></script><script src="../js/magnet.js"></script><script src="../js/ghost.js"></script><script src="../js/holy.js"></script><script src="../js/cosmic.js?v=20261014-cosmic1"></script><script src="../js/charge.js"></script><script src="../js/stellar.js"></script><script src="../js/arcana.js"></script><script src="../js/engine.js"></script><script src="../js/audio.js"></script><script src="../js/spectacle.js"></script><script src="../js/renderer.js"></script><script src="../js/cosmic-render.js?v=20261014-cosmic1"></script><script src="../js/holy-render.js"></script><script src="../js/tactics-render.js"></script><script src="../js/ranger-render.js?v=20261014-salvo1"></script>
<script>
const G=OrbDuel,scenes=[],audio=new G.Audio();function pos(b,x,y,vx=0,vy=0){Object.assign(b,{x,y,previousX:x,previousY:y,vx,vy,speed:Math.hypot(vx,vy),hp:10000,maxHp:10000});}
for(const [phase,title] of [['wall','虚化反弹 · 正常碰墙'],['record','虚化 · 真实残影路径'],['echo','退相 · 同速魂影回响'],['hit','魂影 · 独立恐吓命中'],['awake','觉醒 · 三次冲刺录制'],['replay','觉醒 · 冲刺路径重放']]){
 const e=new G.Engine(['ghost','normal'],'echo-scene-'+phase);e.start();const [a,b]=e.balls;pos(a,295,130,220,50);pos(b,180,230);if(['awake','replay'].includes(phase))G.Awakening.activate(a,e);G.Ghost.enter(a,e);a.ghost.until=100;let found=false;
 const steps=phase==='wall'?45:phase==='record'?160:['awake','replay'].includes(phase)?440:150;for(let i=0;i<steps;i++)e.step();
 if(phase==='wall'){pos(a,336.9,130,220);e.step();found=a.vx<0&&a.x>335;}
 if(phase==='record'){found=a.ghost.trace.length>100;}
 if(phase==='awake'){found=a.ghost.lunges===3;}
 if(['echo','hit','replay'].includes(phase)){G.Ghost.finish(a,e);const echo=e.ghostEchoes[0];pos(a,220,280);e.time+=phase==='replay'?.8:.18;e.pendingAttacks=[];G.Ghost.updateEchoes(e);if(phase==='hit'){pos(b,echo.x,echo.y);echo.nextFear={};G.Ghost.updateEchoes(e);G.Combat.resolveBatch(e.pendingAttacks,e);found=a.stats.echoHits>0;}else found=!!echo&&echo.elapsed>0;}
 e.effects=e.effects.filter(f=>['ghostFear','soulBurst'].includes(f.kind));e.effects.forEach(f=>f.age=.05);e.pause();const card=document.createElement('article');card.className='card';card.innerHTML='<h2>'+title+'</h2><canvas></canvas><output></output><button>试听动作</button>';document.querySelector('#grid').append(card);const renderer=new G.Renderer(card.querySelector('canvas'));renderer.draw(e);card.querySelector('output').textContent='穿行 '+a.ghost.lunges+'/3 · 回响 '+(e.ghostEchoes[0]?e.ghostEchoes[0].elapsed.toFixed(2)+'s':'录制')+' · 命中 '+(a.stats.echoHits||0);card.querySelector('button').onclick=async()=>{await audio.unlock();audio.stop();audio.consume(e.soundEvents);};scenes.push({phase,found,e,renderer});
}window.echoDemo={scenes,reports:scenes.map(({phase,found,e})=>({phase,found,cues:e.soundEvents.map(s=>s.kind)}))};
</script></html>
