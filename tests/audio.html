<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>碰撞音效验证</title><style>body{background:#101720;color:#e4eaf2;font:16px/1.8 "Segoe UI","Microsoft YaHei",sans-serif;max-width:800px;margin:60px auto;padding:20px}pre{white-space:pre-wrap;background:#192435;padding:20px;border-radius:8px}button{padding:12px 20px;margin-right:12px;background:#d0fa8b;border:0;border-radius:6px;cursor:pointer}</style><h1>碰撞音效验证</h1><p>用浏览器实际离线渲染音效，检测能量、音高差异及衰减，不需要扬声器或联网。</p><pre id="report">正在验证…</pre><button id="wall">试听撞墙</button><button id="ball">试听球间碰撞</button><p id="play-state">点击按钮解锁浏览器音频。</p><script src="../js/config.js?v=20261013-roster1"></script><script src="../js/audio.js?v=20261013-roster1"></script><script src="../js/audio-mix.js?v=20261017-markers4"></script><script>
(async function(){
  const Audio = window.OrbDuel.Audio;
  const report = document.getElementById('report');
  async function render(kind){
    const spec=Audio.profiles[kind],seconds=Math.max(1,spec.duration+(spec.reverb?.seconds||0)+.12);const ctx = new OfflineAudioContext(1,Math.ceil(48000*seconds),48000);
    Audio.synthesize(ctx,ctx.destination,kind,0);
    const buffer = await ctx.startRendering(), samples = buffer.getChannelData(0);
    let sum=0,peak=0,crossings=0,tail=0,late=0;
    for(let i=0;i<samples.length;i++){if(!Number.isFinite(samples[i]))throw Error(kind+' nonfinite waveform');sum+=samples[i]*samples[i];peak=Math.max(peak,Math.abs(samples[i]));if(i>24000&&i<43200)late+=samples[i]*samples[i];if(i>samples.length-3840)tail+=samples[i]*samples[i];if(i>240&&i<1440&&Math.sign(samples[i])!==Math.sign(samples[i-1]))crossings++;}
    return {rms:Math.sqrt(sum/samples.length),peak,earlyFrequency:crossings/(2*.025),tailEnergy:tail,duration:seconds,lateEnergy:late};
  }
  try{
    const cues={};for(const kind of Object.keys(Audio.profiles))cues[kind]=await render(kind);
    const passed=Object.values(cues).every(c=>c.rms>.003&&c.peak<=1&&c.tailEnergy<1e-8)&&cues.wall.earlyFrequency>cues.ball.earlyFrequency*2;
    report.dataset.result=passed?'passed':'failed';report.textContent=JSON.stringify({result:passed?'通过':'失败',passed,profiles:Object.keys(cues).length,cues},null,2);
  }catch(e){report.dataset.result='failed';report.textContent=e.message;}
  const sound=new Audio();
  const labels={holyWard:'神圣庇护',holySeal:'圣阵成形',holyCharge:'圣裁蓄势',holyWave:'圣光降临',holyLand:'光柱落地冲击',holyFall:'整波降临气流',holyTouch:'光柱轻触碰',holyHit:'圣光命中',holyWater:'圣水侵蚀',ghostCharge:'虚化预警',ghostPhase:'幽灵入相',ghostReturn:'幽灵退相',ghostFear:'恐吓低语',ghostLunge:'追魂穿行',soulBurst:'退相魂爆',soulHit:'魂爆命中',magnetFocus:'吸力补偿',magnetGraze:'牵引轻墙撞',magnetCharge:'磁极蓄势',magnetPull:'强磁吸拽',magnetPush:'猛烈排斥',magnetReverse:'极性反转',magnetCrush:'磁吸压碎',magnetWall:'磁动能墙撞',timeErode:'时间侵蚀',timeField:'时间领域',clockCharge:'时钟蓄势',clockThrow:'时钟投掷',clockBlast:'钟面碎裂',timeSilence:'沉默断音',timeInterrupt:'施法中断',largeHit:'大伤害命中',bladeHeavyHit:'接刃重斩',mirrorAim:'反击刃预瞄',mirrorStrike:'碎镜斩击',chainHit:'连锁强命中',cannonHit:'重炮接触',guardHeavy:'重击护盾',toxinCharge:'腐蚀共鸣预警',toxinSpread:'毒池共鸣',toxinErupt:'湿重毒爆',fistRelease:'拳劲释放',fistHit:'破阵重拳',bloodCharge:'血契预警',bloodFinish:'血契收束',shieldBash:'承压盾击',pressureRelease:'堡垒释放',reload:'机械装填',heavyShot:'过载重弹',laserLock:'锁线确认',cannon:'贯穿重炮',mirrorCatch:'镜片截获',mirrorRelease:'镜裂释放',netArm:'节点布防',netTrigger:'感应线触发',chainBlast:'连锁震地',toxinBurst:'满毒引爆',wallSlam:'撞墙追击',bladeCatch:'完整接刃',wall:'撞墙',ball:'碰撞',heavy:'重击',shot:'射击',shotHit:'弹丸命中',trap:'布雷',explosion:'爆炸',chain:'血链',heal:'吸血回复',shield:'护盾充能',break:'破盾',reflect:'反伤',charge:'蓄力',dash:'冲刺',ready:'重击就绪',stance:'荆棘姿态',counter:'蓄能发射',counterHit:'蓄能命中',shieldHit:'盾受击',ricochet:'跳弹',disarm:'拆雷',combo:'连锁爆炸',throw:'飞刃投掷',return:'飞刃返程',returnHit:'返程命中',laser:'光束发射',laserHit:'光束命中',poison:'毒池',poisonHit:'毒伤',awakenHit:'觉醒重击',bloodPulse:'血月脉冲',thunderHit:'雷霆突袭',revengeHit:'返还光矛',fortressBlast:'堡垒震荡',volley:'三连枪焰',magnetBlast:'磁暴',moonCut:'双月旋斩',beamAwake:'觉醒重炮',corrosion:'腐蚀脉冲',awakening:'觉醒',victory:'胜利'};
  Object.assign(labels,{ghostEcho:'魂影回响',ghostEchoHit:'魂影恐吓',sniperAim:'狙击预瞄',sniperLock:'狙击锁定',sniperShot:'狙击出膛',sniperHit:'狙击重命中',pursuit:'擦肩回身',toxinSpit:'液滴喷射',toxinSplash:'湿润溅液',mineCatch:'锁扣与拉索收紧',mineBlast:'节点爆破',mineHit:'爆破强命中',shardHit:'破片轻触'});
  for(const kind of Object.keys(Audio.profiles)){
    let button=document.getElementById(kind);if(!button){button=document.createElement('button');button.id=kind;button.textContent='试听'+(labels[kind]||kind);document.body.append(button);}
    button.onclick=async()=>{await sound.unlock();sound.consume([{kind,pan:0}]);document.getElementById('play-state').textContent=JSON.stringify(sound.snapshot());};
  }
  const stress=document.createElement('button');stress.id='stress';stress.textContent='密集播放与静音校验';document.body.append(stress);
  stress.onclick=async()=>{
    await sound.unlock();sound.stop();const events=Object.keys(Audio.profiles).map(kind=>({kind,pan:0}));
    for(let i=0;i<100;i++)sound.consume(events);
    const dense=sound.snapshot();sound.setEnabled(false);sound.consume(events);const muted=sound.snapshot();sound.setEnabled(true);
    const passed=dense.activeVoices<=8&&Object.values(dense.played).reduce((a,b)=>a+b,0)<30&&muted.activeVoices===0&&JSON.stringify(dense.played)===JSON.stringify(muted.played);
    document.getElementById('play-state').textContent=JSON.stringify({passed,dense,muted});
  };
})();
</script></html>
