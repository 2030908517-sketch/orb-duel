<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORB DUEL · 表现实验室</title><link rel="stylesheet" href="presentation-lab.css"></head>
<body><header><div><small>ORB DUEL / FEEL LAB</small><h1>表现实验室</h1></div><nav><a href="arcana-lab/index.html">三球奥义</a><a href="collision-study/index.html">碰撞三方案</a><a href="presentation-lab.html">1v1</a><a href="presentation-lab.html?mode=team">2v2</a><a href="../index.html">返回游戏</a></nav></header>
<p class="intro">先确定感受，再验证表现。受控样例用于检查事件协同，不是新角色技能或平衡结论；“真实对局”沿用正式机制。</p>
<main><section class="stage"><div class="canvas-wrap"><canvas id="arena" aria-label="可复现的表现预览"></canvas></div><div id="notice" role="status">加载中…</div><div class="transport"><button id="play">播放 / 继续</button><button id="pause">暂停</button><button id="step">单步</button><button id="reset">重放</button><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select><output id="clock">0.00s / 0 tick</output></div><label class="scrub">关键帧 <input id="seek" type="range" min="0" max="1440" value="0"><output id="frame-label">0</output></label><p id="stats"></p></section>
<aside><h2>场景与参数</h2><label>场景<select id="scene"><option value="light">轻命中 · 受控结果</option><option value="heavy" selected>重命中 · 受控结果</option><option value="block">护盾吸收</option><option value="immune">无敌避伤</option><option value="cancel">预备后取消</option><option value="sequence">多阶段事件样例</option><option value="corner">贴墙 / 角落</option><option value="dense">密集事件预算</option><option value="live">真实对局 · 六秒样本</option></select></label><label>随机种子<input id="seed" value="feel-001" maxlength="32"></label><div id="parameters"></div><label class="check"><input id="sound" type="checkbox" checked>声音</label><label class="check"><input id="motion" type="checkbox">减少镜头动态</label><p class="hint">参数只影响新表现通道。拖动会重放到当前帧：画面立即更新，声音在下次播放时更新。不会改正式角色参数。</p>
<h2>采集</h2><div class="capture"><button id="png">关键帧 PNG</button><button id="json">事件 JSON</button><button id="preset">参数 JSON</button><button id="record-video">录制画面＋声音</button><button id="record-audio">仅录声音</button><button id="stop-record">结束录制</button></div><div id="downloads"></div><p id="capability" class="hint"></p><p id="record-state" role="status"></p></aside></main>
<section class="timeline"><h2>事件时间线 <small>模拟时间与音频时钟分列</small></h2><div class="table-wrap"><table><thead><tr><th>模拟秒</th><th>阶段 / 事件</th><th>ID / 关联</th><th>结果 / 声音</th></tr></thead><tbody id="events"></tbody></table></div></section>
<footer>工具检查 ≠ 主观品质。截图需观察，动作需连续观看，音色需实际试听。<a href="../docs/design/README.md">设计规范</a></footer><script src="presentation-lab.js"></script></body></html>
