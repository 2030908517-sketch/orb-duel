<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>竞技场尺寸与结束状态回归</title><style>body{background:#0c1016;color:#d0fa8b;font:13px/1.7 monospace;padding:16px}iframe{display:block;border:1px solid #354235;margin:20px 0}button{padding:12px;background:#d0fa8b;border:0;border-radius:5px}pre{white-space:pre-wrap}</style><h1>侧栏布局、同比例放大、结束不缩场</h1><button id="run">开始验证</button><pre id="report">等待运行</pre><div id="frames"></div><script>
const sizes=[[1920,1080],[2048,998],[1366,768],[1280,720],[1100,720],[960,720],[320,720],[1280,600],[1200,640],[1330,700],[600,720]],frames=[],wait=ms=>new Promise(r=>setTimeout(r,ms));
for(const [width,height] of sizes){const f=document.createElement('iframe');f.width=width;f.height=height;f.title=width+'×'+height;f.src='../index.html?v=20261013-roster1';document.querySelector('#frames').append(f);frames.push(f);}
document.querySelector('#run').onclick=async()=>{
 const checks=[],records=[],report=document.querySelector('#report');let samples=0;const check=(v,m)=>{if(!v)throw Error(m);checks.push(m);};
 try{
  for(const f of frames){const d=f.contentDocument,w=f.contentWindow,$=id=>d.getElementById(id),change=(id,v)=>{$(id).value=v;$(id).dispatchEvent(new Event('change',{bubbles:true}));},label=f.title;let deadline=performance.now()+10000;while(!$('type-0')?.options.length&&performance.now()<deadline)await wait(20);check($('type-0').options.length===10,label+' loaded');
   const geometry=()=>{const r=$('arena').getBoundingClientRect();return {top:r.top+w.scrollY,width:r.width,height:r.height,bar0:$('bar-0').getBoundingClientRect().top+w.scrollY,bar1:$('bar-1').getBoundingClientRect().top+w.scrollY};};let baseline=null,maxClip=0;
   for(const type of [...$('type-0').options].map(o=>o.value)){change('type-0',type);change('type-1',type);await wait(12);const g=geometry();check($('fighter-meta-0').querySelectorAll('.stats-skills .stat-chip').length===6,label+' '+type+' six slots');check(Math.abs(g.bar0-g.bar1)<.5,label+' '+type+' aligned health');check(d.querySelector('.transport').getBoundingClientRect().bottom<w.innerHeight-2,label+' '+type+' controls fit');check(d.documentElement.scrollWidth<=w.innerWidth,label+' '+type+' no overflow');if(baseline)check(JSON.stringify(g)===JSON.stringify(baseline),label+' '+type+' fixed switching');else baseline=g;for(const v of d.querySelectorAll('.stats-skills .stat-chip:not(.empty-slot) b'))maxClip=Math.max(maxClip,v.scrollWidth-v.clientWidth);}
   check(maxClip<=1,label+' all ability values readable');check(Math.abs(baseline.width/baseline.height-360/340)<.01,label+' equal scale for field and balls');
   if(w.innerWidth>=1100){check($('fighter-0').getBoundingClientRect().right<$('arena').getBoundingClientRect().left,label+' left rail');check($('fighter-1').getBoundingClientRect().left>$('arena').getBoundingClientRect().right,label+' right rail');check(baseline.top<150,label+' upper HUD frees height');}
   const old={'1280×720':407.22,'1366×768':458.22,'1920×1080':738};if(old[label])check(baseline.width>old[label]*1.15,label+' field enlarged at least 15 percent');
   const before=geometry();d.querySelector('.skill-details summary').click();await wait(25);check(JSON.stringify(geometry())===JSON.stringify(before),label+' details cannot shrink arena');d.querySelector('.skill-details summary').click();
   change('type-0','normal');change('type-1','ranger');change('seed','theatre-end-0');d.querySelector('[data-speed="4"]').click();$('sound-toggle').click();const ready=geometry();$('toggle').click();check($('state-badge').textContent==='对战进行中',label+' start');await wait(90);$('toggle').click();const paused=$('timer').textContent;await wait(80);check($('state-badge').textContent==='已暂停'&&$('timer').textContent===paused,label+' pause');check(JSON.stringify(geometry())===JSON.stringify(ready),label+' pause size stable');$('toggle').click();records.push({label,d,w,$,geometry,ready,ended:false});
  }
  report.textContent='正在观察实际对局结束…';const end=performance.now()+60000;
  while(performance.now()<end){for(const r of records){check(JSON.stringify(r.geometry())===JSON.stringify(r.ready),r.label+' running/end size stable');if(r.$('state-badge').textContent==='对战结束'&&!r.ended){check(!r.$('result-summary').hidden,r.label+' real result visible');r.ended=true;}}samples++;if(records.every(r=>r.ended))break;await wait(60);}
  for(const r of records){check(r.ended,r.label+' reaches result');const ended=r.geometry();r.$('restart').click();await wait(50);check(r.$('state-badge').textContent==='准备就绪',r.label+' restart');check(JSON.stringify(r.geometry())===JSON.stringify(ended),r.label+' restart size stable');r.endSize=ended;}
  report.dataset.result='passed';report.textContent=JSON.stringify({passed:true,checks:checks.length,samples,records:records.map(r=>({viewport:r.label,ready:r.ready,ended:r.endSize,renderedBallDiameter:r.ready.width*46/360}))},null,2);
 }catch(e){report.dataset.result='failed';report.textContent=JSON.stringify({passed:false,checks:checks.length,samples,error:e.message,records:records.map(r=>({viewport:r.label,ready:r.ready,current:r.geometry(),state:r.$('state-badge').textContent,timer:r.$('timer').textContent}))},null,2);}
};
</script></html>
