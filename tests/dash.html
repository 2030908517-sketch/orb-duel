<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>衰减冲撞 · 实际画面</title><link rel="icon" href="../favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#0c1016;color:#e9edf5;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}h1{font-size:24px;margin:0 0 8px}header p{color:#8b9bb0;margin:0 0 24px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1240px;margin:auto}article{background:#151d28;border:1px solid #303d51;border-radius:9px;overflow:hidden}h2{font-size:14px;margin:14px 15px 5px}p{font-size:11px;color:#9aabc2;margin:0 15px 12px;line-height:1.6}canvas{display:block;width:100%;aspect-ratio:18/17}.badge{float:right;font-size:10px;color:#d0fa8b}#results{white-space:pre-wrap;max-width:1240px;margin:auto;color:#a2d19c;font:11px Consolas,monospace}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:440px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>衰减冲撞 · 反弹追击 · 动能传递</h1><p>四张画面来自真实种子对局，展示连续墙反弹、撞敌截停和动能二段伤害。</p></header><div class="grid" id="grid"></div><details><summary>查看验证数据</summary><pre id="results"></pre></details>
<script src="../js/config.js?v=20261013-ricochet5"></script><script src="../js/physics.js?v=20261013-ricochet5"></script><script src="../js/skills.js?v=20261013-ricochet5"></script><script src="../js/world.js?v=20261013-ricochet5"></script><script src="../js/characters.js?v=20261013-ricochet5"></script><script src="../js/awakening.js?v=20261013-ricochet5"></script><script src="../js/engine.js?v=20261013-ricochet5"></script><script src="../js/spectacle.js?v=20261013-ricochet5"></script><script src="../js/renderer.js?v=20261013-ricochet5"></script><script>

'use strict';const G=window.OrbDuel,report=[];
const phases=[['bounce1','墙反弹不中断','冲撞速度持续衰减，第一次撞墙后保持无敌。'],['bounce2','连续反弹追击','第二次墙反弹后仍在冲撞，方向只随墙面镜面反弹。'],['contact','命中立即截停','撞敌后恢复常规运动；命中伤害由撞击速度决定，传递法向动量。'],['wall','动能撞墙追击','敌人首次撞墙时按法向动能追加伤害，一次击退只结算一次。']];
for(const [phase,title,description] of phases){let engine=null,bounceCount=0;
 for(let seed=0;seed<80&&!engine;seed++){
  const e=new G.Engine(['accelerator','normal'],'decay-gallery-'+seed);e.start();let cast=-1,walls=0;
  while(e.state==='running'&&e.time<100){const b=e.balls[0],before={vx:b.vx,vy:b.vy,dashing:G.Awakening.dashing(b,e),dashHits:b.stats.dashHits,wallSlams:b.stats.wallSlams};e.step();const active=G.Awakening.dashing(b,e);
   if(active&&cast!==b.awakening.dashStartedAt){cast=b.awakening.dashStartedAt;walls=0;}
   if(active&&before.dashing&&(before.vx*b.vx<0||before.vy*b.vy<0))walls++;
   if((phase==='bounce1'&&active&&walls===1)||(phase==='bounce2'&&active&&walls>=2)||(phase==='contact'&&b.stats.dashHits>before.dashHits)||(phase==='wall'&&b.stats.wallSlams>before.wallSlams&&b.awakening.dashHit&&e.time-b.awakening.dashStartedAt<1.7)) {engine=e;bounceCount=walls;break;}
  }
 }
 if(!engine){report.push({phase,error:'phase not reached'});continue;}
 if(phase==='contact'||phase==='wall')for(let i=0;i<10&&engine.state==='running';i++)engine.step();engine.pause();
 const b=engine.balls[0],t=engine.balls[1],article=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),canvas=document.createElement('canvas');h.textContent=title;h.style.color=b.def.color;p.textContent=description+' '+engine.time.toFixed(2)+'s · '+engine.seed;article.append(h,p,canvas);document.querySelector('#grid').append(article);new G.Renderer(canvas).draw(engine);
 report.push({phase,seed:engine.seed,time:engine.time,bounceCount,speed:Math.hypot(b.vx,b.vy),targetSpeed:Math.hypot(t.vx,t.vy),invulnerable:G.Awakening.dashing(b,engine),stats:b.stats,rendered:true});
}
document.querySelector('#results').textContent=JSON.stringify({passed:report.length===4&&report.every(r=>r.rendered)&&report[1].bounceCount>=2&&report[1].invulnerable&&!report[2].invulnerable,report},null,2);
</script></body></html>
