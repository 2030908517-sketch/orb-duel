<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="纯矢量代码绘制的深红弧形血刃">
  <defs>
    <linearGradient id="blood" x1="460" y1="340" x2="888" y2="340" gradientUnits="userSpaceOnUse"><stop stop-color="#651329"/><stop offset=".53" stop-color="#98132b"/><stop offset=".83" stop-color="#c51d32"/><stop offset="1" stop-color="#f14b46"/></linearGradient>
    <linearGradient id="edge" x1="460" y1="100" x2="790" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#ab2537"/><stop offset=".28" stop-color="#f34d4b"/><stop offset=".55" stop-color="#ffb09a"/><stop offset=".73" stop-color="#ff6256"/><stop offset="1" stop-color="#b82136"/></linearGradient>
    <linearGradient id="tail" x1="170" y1="390" x2="710" y2="330" gradientUnits="userSpaceOnUse"><stop stop-color="#6f142b" stop-opacity="0"/><stop offset=".35" stop-color="#8e1730" stop-opacity=".7"/><stop offset="1" stop-color="#c52239"/></linearGradient>
