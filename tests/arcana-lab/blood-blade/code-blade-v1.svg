    <path d="M520 177 C639 220 734 285 758 359" fill="none" stroke="#3e1024" stroke-width="5" stroke-linecap="round"/>
    <path d="M769 397 C752 478 667 554 571 589" fill="none" stroke="#431024" stroke-width="6" stroke-linecap="round"/>
    <path d="M584 184 C703 241 776 299 789 360" fill="none" stroke="#f44a48" stroke-width="2.5" opacity=".7"/>
    <path d="M800 418 C775 490 707 548 641 579" fill="none" stroke="#f54c49" stroke-width="2" opacity=".65"/>
    <path d="M616 331 L697 358 L642 356Z M641 428 L711 400 L668 439Z" fill="#491126"/>
  </g>
  <!-- The cutting edge is selective and narrow; the concave liquid edge stays dark. -->
  <path d="M348 92 C624 53 854 167 884 337 C916 507 731 642 438 614 C646 617 801 537 850 433 C923 278 729 94 348 92Z" fill="url(#edge)"/>
  <path d="M748 185 C821 236 864 297 874 358 C881 412 858 458 819 496" fill="none" stroke="#ffb29a" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M852 294 C867 320 874 346 875 368" fill="none" stroke="#ffe2c5" stroke-width="1.5" stroke-linecap="round"/>
