    <path d="M402 109 C650 110 806 236 821 359 C834 467 722 571 554 603 C728 574 865 477 859 358 C852 225 658 88 402 109Z" fill="#ff5650" opacity=".48"/>
    <path d="M438 137 C626 178 735 272 737 383 C739 467 656 547 531 593 C659 568 782 484 781 380 C779 253 616 155 438 137Z" fill="#6a1028"/>
