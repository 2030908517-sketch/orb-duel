    <path d="M716 438 C713 479 671 533 613 565 C698 533 749 489 770 446 L743 462 L754 426Z" fill="#df2c39"/>
    <path d="M731 299 C769 342 782 390 752 446 C799 402 804 349 767 298 L776 335Z" fill="#ee3d42"/>
